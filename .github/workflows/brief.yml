name: brief

on:
  schedule:
    # Three drops a day. Pacific: 6 am / noon / 6 pm in summer (PDT), 5 / 11 / 5 in winter (PST).
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-job
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build this drop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          BRIEF_EFFORT: ${{ vars.BRIEF_EFFORT }}
        run: node job/build-brief.mjs

      - name: Validate
        run: node job/build-brief.mjs --validate

      - name: Commit data
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: drop $(date -u +%Y-%m-%dT%H)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
