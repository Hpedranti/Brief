name: brief

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 6 am PDT / 5 am PST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-job
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
        run: node job/build-brief.mjs

      - name: Validate
        run: node job/build-brief.mjs --validate

      - name: Commit data
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: $(TZ=America/Los_Angeles date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
